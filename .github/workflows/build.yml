name: Card

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Card tests and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dashboard-card/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/dashboard-card
      - run: pnpm typecheck
        working-directory: apps/dashboard-card
      - run: pnpm test
        working-directory: apps/dashboard-card
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/dashboard-card
      - run: pnpm test:browser
        working-directory: apps/dashboard-card
      - run: pnpm build
        working-directory: apps/dashboard-card
      - name: Verify committed card bundle
        run: |
          bundle=custom_components/backend_butler/frontend/backend-butler-card.js
          if ! git ls-files --error-unmatch "$bundle" >/dev/null 2>&1 || ! git diff --exit-code --quiet -- "$bundle"; then
            echo "::error::Card bundle is stale. Run pnpm --dir apps/dashboard-card build and commit the generated bundle."
            exit 1
          fi
