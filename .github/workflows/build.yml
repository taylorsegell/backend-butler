name: Card

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Card tests and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dashboard-card/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/dashboard-card
      - run: pnpm typecheck
        working-directory: apps/dashboard-card
      - run: pnpm test
        working-directory: apps/dashboard-card
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/dashboard-card
      - run: pnpm test:browser
        working-directory: apps/dashboard-card
      - run: pnpm build
        working-directory: apps/dashboard-card
      - name: Verify committed card bundle
        run: |
          bundle=custom_components/backend_butler/frontend/backend-butler-card.js
          if ! git ls-files --error-unmatch "$bundle" >/dev/null 2>&1 || ! git diff --exit-code --quiet -- "$bundle"; then
            echo "::error::Card bundle is stale. Run pnpm --dir apps/dashboard-card build and commit the generated bundle."
            exit 1
          fi
