name: Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [apps/voice-worker, apps/household-service]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.13.0'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
        if: matrix.project == 'apps/voice-worker'
      - run: uv run --no-sync pytest -q

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: docker-compose.yml is valid with the example env
        run: cp .env.example .env && docker compose config --quiet
      - name: Verify fresh and legacy migration paths
        run: python3 scripts/check-migration.py
