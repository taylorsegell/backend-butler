name: Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [apps/voice-worker, apps/household-service]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.0'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
        if: matrix.project == 'apps/voice-worker'
      - run: uv run --no-sync pytest -q

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker-compose.yml is valid with the example env
        run: cp .env.example .env && docker compose config --quiet
