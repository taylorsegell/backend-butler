name: Security

on:
  workflow_call:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [apps/dashboard-card, apps/configuration-app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.project == 'apps/dashboard-card'
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test the expiring audit policy
        run: python3 -m unittest discover -s scripts -p test_audit_javascript.py
      - name: Audit locked card dependencies
        if: matrix.project == 'apps/dashboard-card'
        working-directory: apps/dashboard-card
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          node --test ../../scripts/test-picomatch-integrity.cjs
          node ../../scripts/test-picomatch-security.cjs --app dashboard-card
          python3 ../../scripts/audit-javascript.py pnpm
      - name: Audit locked app dependencies
        if: matrix.project == 'apps/configuration-app'
        working-directory: apps/configuration-app
        run: |
          npm ci --ignore-scripts
          node --test ../../scripts/test-picomatch-integrity.cjs
          node ../../scripts/test-picomatch-security.cjs --app configuration-app
          python3 ../../scripts/audit-javascript.py npm

  python:
    name: Python audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [apps/voice-worker, apps/household-service]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.0'
          python-version: '3.13'
      - run: uv sync --frozen
      - name: Audit the installed locked environment
        run: |
          site_dir="$(uv run --no-sync python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          uvx --from pip-audit==2.10.1 pip-audit --path "$site_dir" --strict

  secrets:
    name: Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.30.1'
        run: |
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          gh release download "v$GITLEAKS_VERSION" --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt" --dir "$install_dir"
          cd "$install_dir"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar --no-same-owner -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan all fetched history with redacted output
        run: gitleaks git --redact --log-opts=--all
